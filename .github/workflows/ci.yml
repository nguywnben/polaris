name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Required: Python verification (${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ENABLE_LOG: "0"
      CREDENTIALS_DIR: /tmp/polaris-tests/credentials
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt

      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: "Required: dependency compatibility"
        run: python -m pip check

      - name: "Required: dependency audit"
        if: matrix.python-version == '3.12'
        run: python -m pip_audit --local --progress-spinner off

      - name: "Required: fast gate"
        if: matrix.python-version == '3.12'
        run: python tools/quality_gate.py fast

      - name: "Required: Python compile (3.14)"
        if: matrix.python-version == '3.14'
        run: python -m compileall -q backend

      - name: "Required: test partition audit (3.14)"
        if: matrix.python-version == '3.14'
        run: python -m backend.tests --audit

      - name: "Required: production core tests"
        run: python -m backend.tests --suite core

      - name: "Required: route contracts"
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, "backend")
          import main

          paths = set(main.app.openapi()["paths"])
          required = {
              "/v1/chat/completions",
              "/v1/responses",
              "/v1/messages",
              "/v1/models",
              "/v1beta/models",
              "/health",
              "/ready",
              "/api/auth/login",
              "/api/auth/keys",
              "/api/credentials/status",
              "/api/model-catalog",
              "/api/model-pools/polaris",
          }
          missing = sorted(required - paths)
          forbidden_prefixes = tuple(
              "/" + name
              for name in ("og" + "w", "om" + "ni", "gate" + "way", "primary")
          )
          forbidden = [path for path in paths if path.startswith(forbidden_prefixes)]

          if missing:
              raise SystemExit(f"Missing route(s): {missing}")
          if forbidden:
              raise SystemExit(f"Forbidden branded route(s): {forbidden}")
          ui_paths = {"/", "/dashboard", "/models", "/pool", "/providers"}
          exposed_ui_paths = sorted(ui_paths & paths)
          if exposed_ui_paths:
              raise SystemExit(f"UI route(s) leaked into OpenAPI: {exposed_ui_paths}")
          print("Route contract verified.")
          PY

      - name: "Required: application smoke"
        if: matrix.python-version == '3.12'
        env:
          CREDENTIALS_DIR: /tmp/polaris-ci/creds
          LOG_FILE: /tmp/polaris-ci/logs/runtime.log
        run: |
          python backend/main.py > /tmp/polaris-ci.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4283/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/polaris-ci.log
              exit 1
            fi
            sleep 1
          done
          python backend/tests/runtime_smoke.py --expect-fresh-setup
          curl --fail --silent http://127.0.0.1:4283/frontend/assets/providers/google-antigravity.png >/dev/null
          curl --fail --silent http://127.0.0.1:4283/frontend/assets/providers/google-ai-studio.png >/dev/null
          curl --fail --silent http://127.0.0.1:4283/frontend/assets/providers/grok-build.png >/dev/null
          curl --fail --silent http://127.0.0.1:4283/frontend/assets/providers/spacexai-console.png >/dev/null
          curl --fail --silent http://127.0.0.1:4283/frontend/assets/providers/codex.png >/dev/null
          curl --fail --silent http://127.0.0.1:4283/frontend/assets/providers/openai-platform.png >/dev/null

      - name: "Required: generated artifact audit"
        if: matrix.python-version == '3.12'
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' >/dev/null; then
            echo "Tracked Python cache artifacts found."
            exit 1
          fi

  container-smoke:
    name: "Required: container smoke"
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: polaris-ci
      IMAGE: polaris:ci
      HOST_PORT: "4283"
      DATA_VOLUME: polaris-ci-data
      SETUP_TOKEN: container-smoke-token-2026-secure
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install smoke-test client
        run: python -m pip install "httpx==0.28.1"

      - name: Build container image
        run: docker build --tag polaris:ci --file deploy/Dockerfile .

      - name: Start canonical Compose profile
        run: |
          docker compose -f deploy/docker-compose.yml up --detach --no-build --wait --wait-timeout 60

      - name: Verify fresh container runtime
        run: |
          trap 'docker compose -f deploy/docker-compose.yml logs app' ERR
          python backend/tests/runtime_smoke.py \
            --expect-fresh-setup \
            --setup-token container-smoke-token-2026-secure
          curl --fail --silent http://127.0.0.1:4283/frontend/assets/providers/google-antigravity.png >/dev/null
          curl --fail --silent http://127.0.0.1:4283/frontend/assets/providers/google-ai-studio.png >/dev/null
          curl --fail --silent http://127.0.0.1:4283/frontend/assets/providers/grok-build.png >/dev/null
          curl --fail --silent http://127.0.0.1:4283/frontend/assets/providers/spacexai-console.png >/dev/null
          curl --fail --silent http://127.0.0.1:4283/frontend/assets/providers/codex.png >/dev/null
          curl --fail --silent http://127.0.0.1:4283/frontend/assets/providers/openai-platform.png >/dev/null

      - name: Recreate and verify durable state
        run: |
          docker compose -f deploy/docker-compose.yml up --detach --force-recreate --no-build --wait --wait-timeout 60
          trap 'docker compose -f deploy/docker-compose.yml logs app' ERR
          python backend/tests/runtime_smoke.py

      - name: Verify graceful stop
        run: docker compose -f deploy/docker-compose.yml stop --timeout 45

      - name: Remove smoke environment
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes --remove-orphans

  browser-smoke:
    name: "Required: browser smoke"
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-browser.txt

      - name: Install locked runtime and browser dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-browser.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: "Required: browser smoke"
        run: python tools/browser_smoke.py

  publish-container:
    name: Publish verified container
    needs:
      - verify
      - browser-smoke
      - container-smoke
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit

  publish-release:
    name: Publish GitHub release
    needs:
      - verify
      - browser-smoke
      - container-smoke
      - publish-container
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          sys.path.insert(0, "backend")
          from app_version import DEFAULT_APPLICATION_VERSION

          if version != DEFAULT_APPLICATION_VERSION:
              raise SystemExit(
                  "Release tag version "
                  f"{version} does not match DEFAULT_APPLICATION_VERSION "
                  f"{DEFAULT_APPLICATION_VERSION}."
              )

          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = f"## [{version}]"

          try:
              start = next(index for index, line in enumerate(lines) if line.startswith(heading))
          except StopIteration as exc:
              raise SystemExit(f"CHANGELOG.md has no section for {version}.") from exc

          end = next(
              (index for index in range(start + 1, len(lines)) if lines[index].startswith("## [")),
              len(lines),
          )
          notes = "\n".join(lines[start + 1 : end]).strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md has no release notes for {version}.")

          output = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          output.write_text(notes + "\n", encoding="utf-8")
          print(f"Prepared release notes for {version}.")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          release_args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --title "Polaris ${RELEASE_TAG#v}"
            --notes-file "$RUNNER_TEMP/release-notes.md"
            --verify-tag
          )

          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
