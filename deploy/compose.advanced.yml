# Optional production controls. Layer this file on top of docker-compose.yml only
# when the corresponding feature is intentionally configured and operated.
services:
  app:
    environment:
      # Browser and panel hardening
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      PANEL_SESSION_TTL_SECONDS: ${PANEL_SESSION_TTL_SECONDS:-86400}
      PANEL_COOKIE_SECURE: ${PANEL_COOKIE_SECURE:-}
      PANEL_LOGIN_WINDOW_SECONDS: ${PANEL_LOGIN_WINDOW_SECONDS:-300}
      PANEL_LOGIN_MAX_ATTEMPTS: ${PANEL_LOGIN_MAX_ATTEMPTS:-10}
      PANEL_LOGIN_MAX_TRACKED_CLIENTS: ${PANEL_LOGIN_MAX_TRACKED_CLIENTS:-10000}
      MAX_REQUEST_BODY_MB: ${MAX_REQUEST_BODY_MB:-64}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}

      # Optional identity provider. Disabled until all required trust inputs are set.
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_CLIENT_SECRET_FILE: ${OIDC_CLIENT_SECRET_FILE:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_ID_TOKEN_SIGNING_ALGORITHMS: ${OIDC_ID_TOKEN_SIGNING_ALGORITHMS:-RS256}
      OIDC_SUBJECT_CLAIM: ${OIDC_SUBJECT_CLAIM:-sub}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-preferred_username}
      OIDC_DISPLAY_NAME_CLAIM: ${OIDC_DISPLAY_NAME_CLAIM:-name}
      OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-email}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_ROLE_MAPPINGS: '${OIDC_ROLE_MAPPINGS:-{}}'
      OIDC_ALLOWED_ENDPOINT_ORIGINS: ${OIDC_ALLOWED_ENDPOINT_ORIGINS:-}
      OIDC_ALLOWED_PRIVATE_HOSTS: ${OIDC_ALLOWED_PRIVATE_HOSTS:-}
      OIDC_CONNECT_TIMEOUT_SECONDS: ${OIDC_CONNECT_TIMEOUT_SECONDS:-5}
      OIDC_READ_TIMEOUT_SECONDS: ${OIDC_READ_TIMEOUT_SECONDS:-10}
      OIDC_MAX_RESPONSE_BYTES: ${OIDC_MAX_RESPONSE_BYTES:-262144}
      OIDC_JWKS_TTL_SECONDS: ${OIDC_JWKS_TTL_SECONDS:-300}
      OIDC_START_WINDOW_SECONDS: ${OIDC_START_WINDOW_SECONDS:-300}
      OIDC_START_MAX_ATTEMPTS: ${OIDC_START_MAX_ATTEMPTS:-20}
      OIDC_START_MAX_TRACKED_CLIENTS: ${OIDC_START_MAX_TRACKED_CLIENTS:-10000}

      # Optional storage and outbound proxy
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-polaris}
      POSTGRESQL_URI: ${POSTGRESQL_URI:-}
      PROXY: ${PROXY:-}

      # Routing, cache, and guardrails
      ROUTING_STRATEGY: ${ROUTING_STRATEGY:-balanced}
      PREFERRED_PROVIDER: ${PREFERRED_PROVIDER:-}
      RESPONSE_CACHE_ENABLED: ${RESPONSE_CACHE_ENABLED:-false}
      RESPONSE_CACHE_TTL_SECONDS: ${RESPONSE_CACHE_TTL_SECONDS:-300}
      RESPONSE_CACHE_MAX_ENTRIES: ${RESPONSE_CACHE_MAX_ENTRIES:-1000}
      GUARDRAILS_ENABLED: ${GUARDRAILS_ENABLED:-false}
      GUARDRAILS_PII_MASKING_ENABLED: ${GUARDRAILS_PII_MASKING_ENABLED:-true}
      GUARDRAILS_INJECTION_DETECTION_ENABLED: ${GUARDRAILS_INJECTION_DETECTION_ENABLED:-true}
      GUARDRAILS_BLOCKED_KEYWORDS: ${GUARDRAILS_BLOCKED_KEYWORDS:-}

      # Dynamic public model pricing (cached; inference remains offline-safe)
      PRICING_SYNC_ENABLED: ${PRICING_SYNC_ENABLED:-true}
      PRICING_SYNC_INTERVAL_HOURS: ${PRICING_SYNC_INTERVAL_HOURS:-24}

      # File logging and opt-in aggregate telemetry
      LOG_FILE: ${LOG_FILE:-./backend/data/logs/polaris.log}
      LOG_MAX_MB: ${LOG_MAX_MB:-10}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-3}
      PROMETHEUS_EXPORT_ENABLED: ${PROMETHEUS_EXPORT_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/json}
      OTEL_EXPORT_INTERVAL_SECONDS: ${OTEL_EXPORT_INTERVAL_SECONDS:-60}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
