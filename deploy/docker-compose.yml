services:
  app:
    # For an unpublished checkout, build a local IMAGE; see docs/releases/1.0.0-preparation.md.
    image: ${IMAGE:-nguywnben/polaris:1.0.0}
    pull_policy: missing
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "${HOST_PORT:-4283}:4283"
    environment:
      # Empty authentication values preserve automatic API-key generation and
      # the first-run web setup flow. Supply secrets at runtime, never at build time.
      API_KEY: ${API_KEY:-}
      PANEL_PASSWORD: ${PANEL_PASSWORD:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}

      # The supported production topology is one process and one replica.
      HOST: "0.0.0.0"
      PORT: "4283"
      WORKERS: "1"
      POLARIS_RUNTIME_MODE: standalone
      POLARIS_REPLICA_COUNT: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - type: volume
        source: data
        target: /app/backend/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:4283/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  data:
    name: ${DATA_VOLUME:-polaris-data}
